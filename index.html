<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ashima Engineering, homes in South Kolkata since 1995</title>
    <meta name="description" content="Residential developer in South Kolkata, founded 1993. Sixty-plus buildings delivered in Santoshpur, Garfa, Jadavpur, Mukundapur, Baruipur and Sonarpur since 1995." />
    <meta name="robots" content="index, follow" />
    <!-- Stops the browser turning flat counts and areas ("14", "685-1120") into
         telephone links, which colours them mid-sentence. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://ashimaengineering.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Ashima Engineering, homes in South Kolkata since 1995" />
    <meta property="og:description" content="Residential developer in South Kolkata, founded 1993. Sixty-plus buildings delivered across South Kolkata since 1995." />
    <meta property="og:image" content="https://ashimaengineering.in/images/projects/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2E4638" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/AshimaSans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/AshimaSans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms detection. This is a single-page app, so Netlify's
         build-time parser cannot see the forms React renders at runtime. These
         hidden copies declare the field names for each form; the real
         submission is posted from src/components/enquiry-form.tsx. Keep the
         names and fields in step with FORM_NAMES there. -->
    <form name="home-enquiry" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="hidden" name="form-name" value="home-enquiry" />
      <input name="company-website" /><input name="name" /><input name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="contact-enquiry" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry" />
      <input name="company-website" /><input name="name" /><input name="phone" />
      <input name="email" /><input name="interest" /><textarea name="message"></textarea>
    </form>
    <form name="project-enquiry" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="hidden" name="form-name" value="project-enquiry" />
      <input name="company-website" /><input name="about" /><input name="name" />
      <input name="phone" /><input name="email" /><input name="interest" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
