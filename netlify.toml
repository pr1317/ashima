[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The launch build. Point Netlify's production context at this once every live
# project carries a verified WBRERA number — scripts/rera-guard.mjs refuses to
# run until they do.
#   [context.production]
#     command = "npm run build:launch"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The editor. It is behind a GitHub sign-in, but there is no reason for it to
# be in search results, and the vendored editor bundle never changes without
# a new deploy, so it can be cached hard.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
